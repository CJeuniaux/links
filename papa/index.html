<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fbf6ec" />
  <title>Le bureau de Papa</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Atkinson Hyperlegible : police conçue pour les personnes malvoyantes -->
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lora:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Palette « ivoire et or » : chic, calme, contrastes forts pour une vue faible */
      --fond: #f6efe0;
      --fond2: #ebdfc6;
      --carte: #fffaf0;
      --texte: #2a1d12;
      --doux: #5b4a38;
      --or: #b8913f;
      --or-clair: #d9bf82;
      --brun: #3a2a1a;
      --bronze: #7a5a1e;
      --bordeaux: #7b1e2b;
      /* anciens noms utilisés par les boutons */
      --vert: var(--bronze);
      --bleu: var(--brun);
      --sarcelle: var(--brun);
      --retour: var(--brun);
      --rose: var(--bordeaux);
      --jaune: #e0a100;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% -10%, #fffdf6 0%, rgba(255,253,246,0) 60%),
        linear-gradient(180deg, var(--fond) 0%, var(--fond2) 100%);
      color: var(--texte);
      font-family: "Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    /* Cadre doré discret autour de l'écran */
    body::before {
      content: ""; position: fixed; inset: 10px; border: 1.5px solid var(--or-clair);
      border-radius: 22px; pointer-events: none; z-index: 20;
    }
    .serif { font-family: "Lora", Georgia, "Times New Roman", serif; }
    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }
    button:focus-visible { outline: 7px solid var(--jaune); outline-offset: 5px; }

    .ecran { display: none; height: 100vh; padding: 3.2vh 3.5vw 3vh; flex-direction: column; gap: 2.4vh; animation: apparition .35s ease-out; }
    .ecran.actif { display: flex; }
    @keyframes apparition { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .ecran { animation: none; } }

    /* ---------- Accueil ---------- */
    .entete { text-align: center; }
    .bonjour {
      font-family: "Lora", Georgia, serif; font-size: clamp(40px, 7.4vh, 92px); font-weight: 700; line-height: 1.05;
      color: var(--brun);
    }
    .ligne-date {
      display: flex; align-items: baseline; justify-content: center; gap: 1.4vw; flex-wrap: wrap;
      margin-top: .8vh; font-size: clamp(24px, 4.2vh, 52px); color: var(--doux);
    }
    .quand { color: var(--texte); font-weight: 700; }
    .heure { font-family: "Lora", Georgia, serif; font-weight: 700; font-size: 1.35em; color: var(--brun); font-variant-numeric: tabular-nums; }
    .sep { color: var(--or); }
    .moment { font-style: italic; }
    .ornement { display: flex; align-items: center; justify-content: center; gap: 1.2vw; margin-top: 1vh; color: var(--or); font-size: 2.6vh; }
    .ornement::before, .ornement::after { content: ""; height: 1.5px; width: 18vw; background: linear-gradient(90deg, transparent, var(--or)); }
    .ornement::after { background: linear-gradient(90deg, var(--or), transparent); }

    .tuiles { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 2.4vh 2vw; min-height: 0; }
    .tuile {
      display: flex; flex-direction: column; border-radius: 26px; overflow: hidden; padding: 1.1vh;
      color: var(--texte); text-align: center; min-height: 0;
      background: linear-gradient(180deg, var(--carte) 0%, #f7eedb 100%);
      border: 2px solid var(--or-clair);
      box-shadow: 0 10px 26px rgba(70, 50, 20, .16), inset 0 1px 0 #fff;
      transition: transform .15s, box-shadow .15s;
    }
    .tuile:hover { transform: translateY(-4px); box-shadow: 0 0 0 6px var(--jaune), 0 16px 30px rgba(70,50,20,.22); }
    .tuile .image {
      flex: 1; min-height: 0; border-radius: 18px; position: relative;
      background: #efe3c8 center/cover no-repeat;
      display: flex; align-items: center; justify-content: center; font-size: 10vh;
    }
    .tuile .libelle {
      padding: 1.2vh .6vw .3vh; font-family: "Lora", Georgia, serif;
      font-size: clamp(26px, 4.3vh, 54px); font-weight: 700; line-height: 1.05; color: var(--brun);
    }
    .tuile .sous { display: block; font-family: "Atkinson Hyperlegible", sans-serif; font-size: .52em; font-weight: 400; color: var(--doux); margin-top: .2em; }
    .maj {
      position: fixed; right: 22px; bottom: 16px; font-size: 13px; color: #8a7a60; opacity: .5;
      padding: 4px 8px; border-radius: 8px; z-index: 21;
    }
    .maj:hover { opacity: 1; background: #fff; }
    .pastille {
      position: absolute; top: 1.2vh; right: 1.2vh; background: var(--bordeaux); color: #fff;
      font-size: clamp(24px, 4vh, 48px); font-weight: 700; border-radius: 999px;
      min-width: 1.6em; padding: .05em .4em; border: 3px solid var(--or-clair); text-align: center;
      box-shadow: 0 4px 12px rgba(0,0,0,.25);
    }

    /* ---------- Barre du haut des autres écrans ---------- */
    .haut { display: flex; align-items: center; gap: 3vw; padding-bottom: 1.6vh; border-bottom: 1.5px solid var(--or-clair); }
    .btn-retour {
      background: var(--brun); color: #fff8e8; border-radius: 999px; border: 2px solid var(--or);
      font-size: clamp(26px, 4.4vh, 54px); font-weight: 700; padding: 1.3vh 2.8vw;
      display: flex; align-items: center; gap: .4em; flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(40,25,10,.25);
    }
    .btn-retour:hover { box-shadow: 0 0 0 6px var(--jaune); }
    .titre { font-family: "Lora", Georgia, serif; font-size: clamp(32px, 5.6vh, 70px); font-weight: 700; line-height: 1.1; color: var(--brun); }

    .gros-btn {
      border-radius: 999px; color: #fff8e8; font-size: clamp(26px, 4.2vh, 50px); font-weight: 700;
      padding: 1.8vh 3vw; display: inline-flex; align-items: center; gap: .4em;
      border: 2px solid var(--or); box-shadow: 0 8px 18px rgba(40,25,10,.22);
    }
    .gros-btn:hover { box-shadow: 0 0 0 6px var(--jaune); }
    .actions { display: flex; gap: 2.4vw; flex-wrap: wrap; justify-content: center; }

    /* ---------- Contenu (messages / savant / nouvelles) ---------- */
    .contenu { flex: 1; display: flex; gap: 3.5vw; min-height: 0; align-items: center; }
    .contenu > .texte {
      background: var(--carte); border-radius: 26px; padding: 4vh 3vw;
      border: 2px solid var(--or-clair); box-shadow: 0 10px 26px rgba(70,50,20,.14);
    }
    .portrait {
      width: 38vh; height: 38vh; max-width: 36vw; flex-shrink: 0; border-radius: 26px;
      background: #d8c7a3 center/cover no-repeat; display: flex; align-items: center; justify-content: center;
      font-size: 18vh; font-weight: 700; color: #fff; font-family: "Lora", Georgia, serif;
      border: 3px solid var(--or-clair); box-shadow: 0 10px 26px rgba(70,50,20,.2);
    }
    .portrait.grand { width: 60vh; height: 60vh; background-size: contain; background-color: var(--carte); }
    .texte { flex: 1; min-width: 0; }
    .texte .qui { font-family: "Lora", Georgia, serif; font-size: clamp(34px, 6vh, 72px); font-weight: 700; margin-bottom: 2vh; color: var(--brun); line-height: 1.15; }
    .texte .corps { font-size: clamp(34px, 6vh, 74px); line-height: 1.32; }
    .texte .petit { font-size: clamp(22px, 3.2vh, 38px); color: var(--doux); margin-top: 2vh; font-style: italic; }

    /* ---------- Vidéos ---------- */
    .choix-videos { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.4vw; min-height: 0; }
    .choix-videos .libelle { font-size: clamp(22px, 3.4vh, 42px); }
    .lecteur { flex: 1; border-radius: 20px; overflow: hidden; background: #000; border: 2px solid var(--or-clair); }
    .pause {
      display: none; position: fixed; inset: 0; background: linear-gradient(180deg, var(--fond), var(--fond2)); z-index: 10;
      flex-direction: column; align-items: center; justify-content: center; gap: 6vh; text-align: center;
    }
    .pause.visible { display: flex; }
    .pause .quand { font-size: clamp(24px, 4vh, 48px); font-weight: 400; color: var(--doux); font-style: italic; }

    /* ---------- Discuter ---------- */
    .conversation { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 3vh; min-height: 0; }
    .bulle {
      border-radius: 26px; padding: 3vh 3vw; font-size: clamp(30px, 5.4vh, 66px); line-height: 1.3;
      box-shadow: 0 8px 22px rgba(70,50,20,.12); border: 2px solid var(--or-clair);
    }
    .bulle:empty { display: none; }
    .bulle.lui { background: #efe5d0; color: var(--doux); align-self: flex-start; max-width: 85%; font-style: italic; }
    .bulle.ordi { background: var(--carte); align-self: flex-end; max-width: 92%; }
    .micro-zone { display: flex; align-items: center; justify-content: center; gap: 3vw; }
    .micro {
      width: 21vh; height: 21vh; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #9a2a3a, var(--bordeaux));
      color: #fff; font-size: 10vh; border: 4px solid var(--or);
      box-shadow: 0 12px 30px rgba(123,30,43,.35); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .micro:hover { box-shadow: 0 0 0 8px var(--jaune), 0 12px 30px rgba(123,30,43,.35); }
    .micro.ecoute { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(184,145,63,.7); } 50% { box-shadow: 0 0 0 4vh rgba(184,145,63,0); } }
    .etat { font-family: "Lora", Georgia, serif; font-size: clamp(28px, 4.8vh, 58px); font-weight: 700; color: var(--brun); }
    .reecouter { font-size: clamp(22px, 3.4vh, 40px); padding: 1.2vh 2vw; background: var(--bronze); }

    .lecteur iframe, .lecteur > div { width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>

  <!-- ================= ACCUEIL ================= -->
  <section class="ecran actif" id="accueil">
    <div class="entete">
      <div class="bonjour" id="bonjour">Bonjour</div>
      <div class="ligne-date">
        <span class="quand" id="quand"></span>
        <span class="sep">·</span>
        <span class="heure" id="heure"></span>
        <span class="sep">·</span>
        <span class="moment" id="moment"></span>
      </div>
      <div class="ornement">❦</div>
    </div>
    <button class="maj" id="maj" title="Mettre à jour l'application">↻ mise à jour</button>
    <div class="tuiles">
      <button class="tuile t-messages" data-aller="messages" id="tuile-messages">
        <div class="image" id="img-messages">✉️</div>
        <div class="libelle">Messages<span class="sous">de la famille</span></div>
      </button>
      <button class="tuile t-nouvelles" data-aller="nouvelles">
        <div class="image" id="img-nouvelles">📰</div>
        <div class="libelle">Les nouvelles<span class="sous">du jour</span></div>
      </button>
      <button class="tuile t-savant" data-aller="savant">
        <div class="image" id="img-savant">🔬</div>
        <div class="libelle">Le savant<span class="sous">du jour</span></div>
      </button>
      <button class="tuile t-discuter" data-aller="discuter">
        <div class="image" id="img-discuter">🎙️</div>
        <div class="libelle">Discuter<span class="sous">avec l'ordinateur</span></div>
      </button>
      <button class="tuile t-videos" data-aller="videos">
        <div class="image" id="img-videos">🎬</div>
        <div class="libelle">Documentaires<span class="sous">de science</span></div>
      </button>
      <button class="tuile t-films" data-aller="films">
        <div class="image" id="img-films">🎞️</div>
        <div class="libelle">Films<span class="sous">et cinéma</span></div>
      </button>
    </div>
  </section>

  <!-- ================= MESSAGES ================= -->
  <section class="ecran" id="messages">
    <div class="haut">
      <button class="btn-retour" data-aller="accueil">⬅ Retour</button>
      <div class="titre">Messages de la famille</div>
    </div>
    <div class="contenu">
      <div class="portrait" id="msg-portrait"></div>
      <div class="texte">
        <div class="qui" id="msg-qui"></div>
        <div class="corps" id="msg-corps"></div>
        <div class="petit" id="msg-date"></div>
      </div>
    </div>
    <div class="actions">
      <button class="gros-btn" style="background:var(--vert)" id="msg-ecouter">🔊 Écouter</button>
      <button class="gros-btn" style="background:var(--bleu)" id="msg-suivant">Message suivant ➡</button>
    </div>
  </section>

  <!-- ================= NOUVELLES DU JOUR ================= -->
  <section class="ecran" id="nouvelles">
    <div class="haut">
      <button class="btn-retour" data-aller="accueil">⬅ Retour</button>
      <div class="titre">Les nouvelles du jour</div>
    </div>
    <div class="contenu">
      <div class="portrait grand" id="nv-image">📰</div>
      <div class="texte">
        <div class="qui" id="nv-titre"></div>
        <div class="corps" id="nv-texte"></div>
        <div class="petit" id="nv-source"></div>
      </div>
    </div>
    <div class="actions">
      <button class="gros-btn" style="background:var(--vert)" id="nv-ecouter">🔊 Écouter</button>
      <button class="gros-btn" style="background:var(--sarcelle)" id="nv-suivant">Nouvelle suivante ➡</button>
    </div>
  </section>

  <!-- ================= DISCUTER ================= -->
  <section class="ecran" id="discuter">
    <div class="haut">
      <button class="btn-retour" data-aller="accueil">⬅ Retour</button>
      <div class="titre">Discuter avec l'ordinateur</div>
    </div>
    <div class="conversation">
      <div class="bulle lui" id="disc-lui"></div>
      <div class="bulle ordi" id="disc-ordi"></div>
    </div>
    <div class="micro-zone">
      <button class="micro" id="disc-micro" aria-label="Parler">🎤</button>
      <div>
        <div class="etat" id="disc-etat">Appuie sur le micro, puis parle.</div>
        <button class="gros-btn reecouter" id="disc-reecouter" style="display:none">🔊 Réécouter</button>
      </div>
    </div>
  </section>

  <!-- ================= SAVANT DU JOUR ================= -->
  <section class="ecran" id="savant">
    <div class="haut">
      <button class="btn-retour" data-aller="accueil">⬅ Retour</button>
      <div class="titre">Le savant du jour</div>
    </div>
    <div class="contenu">
      <div class="portrait grand" id="sav-portrait"></div>
      <div class="texte">
        <div class="qui" id="sav-nom"></div>
        <div class="corps" id="sav-texte"></div>
      </div>
    </div>
    <div class="actions">
      <button class="gros-btn" style="background:var(--vert)" id="sav-ecouter">🔊 Écouter</button>
    </div>
  </section>

  <!-- ================= DOCUMENTAIRES ================= -->
  <section class="ecran" id="videos">
    <div class="haut">
      <button class="btn-retour" data-aller="accueil">⬅ Retour</button>
      <div class="titre" id="titre-videos">Que veux-tu regarder ?</div>
    </div>
    <div class="choix-videos" id="choix-videos"></div>
    <div class="actions">
      <button class="gros-btn" style="background:var(--bleu)" id="autres-videos">D'autres choix ➡</button>
    </div>
  </section>

  <section class="ecran" id="lecture">
    <div class="haut">
      <button class="btn-retour" id="retour-lecture">⬅ Retour</button>
      <div class="titre" id="lecture-titre"></div>
    </div>
    <div class="lecteur" id="lecteur"></div>
    <div class="pause" id="pause">
      <div class="titre">On fait une petite pause ?</div>
      <div class="actions">
        <button class="gros-btn" style="background:var(--vert)" id="pause-continuer">▶ Continuer le film</button>
        <button class="gros-btn" style="background:var(--retour)" id="pause-arreter">⬅ Arrêter pour aujourd'hui</button>
      </div>
      <div class="quand">Le film reprendra ici la prochaine fois.</div>
    </div>
  </section>

  <script src="contenu.js"></script>
  <script>
  (function () {
    "use strict";
    var C = window.CONTENU || {};
    var INACTIVITE_MS = 3 * 60 * 1000; // retour tout seul à l'accueil après 3 minutes
    var ecranActuel = "accueil";

    // ---------- Utilitaires ----------
    function $(id) { return document.getElementById(id); }
    function lire(cle, defaut) { try { var v = localStorage.getItem(cle); return v === null ? defaut : JSON.parse(v); } catch (e) { return defaut; } }
    function ecrire(cle, v) { try { localStorage.setItem(cle, JSON.stringify(v)); } catch (e) {} }
    function jourNumero() { var d = new Date(); return Math.floor(new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() / 86400000); }
    function fond(el, url) { if (url) { el.style.backgroundImage = "url('" + url.replace(/'/g, "%27") + "')"; el.textContent = ""; } }

    // ---------- Voix ----------
    var voixFr = null;
    function chercherVoix() {
      if (!("speechSynthesis" in window)) return;
      var v = speechSynthesis.getVoices().filter(function (x) { return /^fr/i.test(x.lang); });
      // Une voix installée sur l'ordinateur démarre bien plus vite qu'une voix en ligne.
      var locales = v.filter(function (x) { return x.localService; });
      voixFr = locales.filter(function (x) { return /fr-BE/i.test(x.lang); })[0] || locales[0] ||
               v.filter(function (x) { return /fr-BE/i.test(x.lang); })[0] ||
               v.filter(function (x) { return /google/i.test(x.name); })[0] || v[0] || null;
    }
    if ("speechSynthesis" in window) { chercherVoix(); speechSynthesis.onvoiceschanged = chercherVoix; }
    // Chrome a plusieurs défauts : parler juste après cancel() échoue parfois,
    // et les phrases longues s'arrêtent au bout de ~15 s. On contourne les deux.
    var numeroParole = 0;
    function dire(texte, fin, essai, debut) {
      if (!("speechSynthesis" in window)) { if (fin) fin("pas de synthèse vocale"); return; }
      if (!texte) { if (fin) fin(); return; }
      var moi = ++numeroParole, fait = false, commence = false, garde = null;
      function finir(erreur) {
        if (fait) return; fait = true; clearInterval(garde);
        if (fin && moi === numeroParole) fin(erreur);
      }
      var occupe = speechSynthesis.speaking || speechSynthesis.pending;
      if (occupe) speechSynthesis.cancel();
      setTimeout(function () {
        if (moi !== numeroParole) return;
        var u = new SpeechSynthesisUtterance(texte);
        u.lang = "fr-FR"; u.rate = 0.85; u.volume = 1;
        if (voixFr) u.voice = voixFr;
        u.onstart = function () { commence = true; if (debut) debut(); };
        u.onend = function () { finir(); };
        u.onerror = function (e) {
          // Interrompu par une autre parole : on ne relance rien.
          if (e.error === "interrupted" || e.error === "canceled") { fait = true; clearInterval(garde); return; }
          // Autre erreur (haut-parleur occupé juste après le micro…) : on réessaie une fois.
          if (!essai) { fait = true; clearInterval(garde); setTimeout(function () { dire(texte, fin, true, debut); }, 900); return; }
          finir(e.error || "erreur");
        };
        speechSynthesis.resume();
        speechSynthesis.speak(u);
        garde = setInterval(function () {
          if (!speechSynthesis.speaking) return;
          speechSynthesis.pause(); speechSynthesis.resume();
        }, 10000);
        // Si rien n'a démarré après 2 secondes, on réessaie une fois.
        setTimeout(function () {
          if (commence || fait || moi !== numeroParole) return;
          if (!essai) {
            fait = true; clearInterval(garde); speechSynthesis.cancel();
            setTimeout(function () { dire(texte, fin, true, debut); }, 300);
          } else finir("la voix n'a pas démarré");
        }, 3000);
      }, occupe ? 300 : 50);
    }
    // Lecture à l'ouverture d'un écran : seulement si activée dans contenu.js.
    function direAuto(texte) { if (C.lectureAutomatique === true) dire(texte); }
    function taire() { numeroParole++; if ("speechSynthesis" in window) speechSynthesis.cancel(); }

    // ---------- Navigation ----------
    function aller(nom) {
      taire();
      if (nom === "films" || (nom === "videos" && ecranActuel === "accueil")) {
        choisirRubrique(nom === "films" ? "films" : "videos");
        nom = "videos";
      }
      if (ecranActuel === "lecture" && nom !== "lecture") arreterLecteur();
      if (ecranActuel === "discuter" && nom !== "discuter") fermerDiscussion();
      document.querySelectorAll(".ecran").forEach(function (e) { e.classList.toggle("actif", e.id === nom); });
      ecranActuel = nom;
      if (nom === "messages") ouvrirMessages();
      if (nom === "savant") ouvrirSavant();
      if (nom === "nouvelles") ouvrirNouvelles();
      if (nom === "discuter") ouvrirDiscussion();
      if (nom === "accueil") majAccueil();
      if (nom === "accueil") {
        // Aucune tuile présélectionnée : une touche pressée pour réveiller l'ordi n'ouvre rien.
        if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      } else {
        var premier = document.querySelector("#" + nom + " button");
        if (premier) premier.focus({ preventScroll: true });
      }
    }

    // Moment de calme au démarrage et au réveil : clics et touches ignorés 2 secondes.
    var calmeJusqua = Date.now() + 2000;
    function calme() { calmeJusqua = Date.now() + 2000; }
    ["click", "keydown", "keyup", "mousedown"].forEach(function (t) {
      document.addEventListener(t, function (e) {
        if (Date.now() < calmeJusqua) { e.preventDefault(); e.stopImmediatePropagation(); }
      }, true);
    });
    document.addEventListener("visibilitychange", function () { if (!document.hidden) calme(); });
    document.addEventListener("click", function (e) {
      var b = e.target.closest("[data-aller]");
      if (b) aller(b.getAttribute("data-aller"));
    });

    // Clavier : Échap / Retour arrière = revenir ; 1-2-3 = tuiles ; flèches = changer de bouton
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" || e.key === "Backspace") {
        e.preventDefault();
        aller(ecranActuel === "lecture" ? "videos" : "accueil");
      } else if (ecranActuel === "accueil" && ["1", "2", "3", "4", "5", "6"].indexOf(e.key) >= 0) {
        aller(["messages", "nouvelles", "savant", "discuter", "videos", "films"][+e.key - 1]);
      } else if (/^Arrow/.test(e.key)) {
        var btns = Array.prototype.slice.call(document.querySelectorAll("#" + ecranActuel + " button"));
        var i = btns.indexOf(document.activeElement);
        var pas = (e.key === "ArrowRight" || e.key === "ArrowDown") ? 1 : -1;
        var suivant = btns[(i + pas + btns.length) % btns.length];
        if (suivant) { e.preventDefault(); suivant.focus(); }
      }
    });

    // Pas de menu clic droit, pas de glisser-déposer, pas de zoom accidentel
    document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    document.addEventListener("dragstart", function (e) { e.preventDefault(); });
    document.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

    // Retour automatique à l'accueil (sauf pendant une vidéo)
    var minuteur;
    function activite() {
      clearTimeout(minuteur);
      minuteur = setTimeout(function () { if (ecranActuel !== "lecture" && ecranActuel !== "accueil") aller("accueil"); }, INACTIVITE_MS);
    }
    ["mousemove", "mousedown", "keydown"].forEach(function (t) { document.addEventListener(t, activite); });
    activite();

    // ---------- Accueil : date, heure, moment de la journée ----------
    function moment(h) {
      if (h < 6) return "C'est la nuit";
      if (h < 12) return "C'est le matin";
      if (h < 14) return "C'est l'heure de midi";
      if (h < 18) return "C'est l'après-midi";
      if (h < 22) return "C'est le soir";
      return "C'est la nuit";
    }
    function majHorloge() {
      var d = new Date();
      var h = d.getHours();
      var salut = (h >= 18 || h < 5) ? "Bonsoir " : "Bonjour ";
      $("bonjour").textContent = salut + (C.prenom || "") + " !";
      var date = d.toLocaleDateString("fr-BE", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
      date = date.charAt(0).toUpperCase() + date.slice(1);
      $("quand").textContent = date;
      $("heure").textContent = h + ":" + String(d.getMinutes()).padStart(2, "0");
      $("moment").textContent = moment(h);
    }
    function phraseDuMoment() {
      var d = new Date();
      return $("bonjour").textContent + " Nous sommes " + $("quand").textContent + ". Il est " + d.getHours() + " heures " +
        (d.getMinutes() ? d.getMinutes() : "") + ". " + moment(d.getHours()) + ".";
    }
    majHorloge();
    setInterval(majHorloge, 20000);

    // ---------- Messages ----------
    var messages = [];
    var indexMessage = 0;

    function parseCsv(txt) {
      var lignes = [], ligne = [], champ = "", guill = false;
      for (var i = 0; i < txt.length; i++) {
        var c = txt[i];
        if (guill) {
          if (c === '"' && txt[i + 1] === '"') { champ += '"'; i++; }
          else if (c === '"') guill = false;
          else champ += c;
        } else if (c === '"') guill = true;
        else if (c === ",") { ligne.push(champ); champ = ""; }
        else if (c === "\n") { ligne.push(champ); lignes.push(ligne); ligne = []; champ = ""; }
        else if (c !== "\r") champ += c;
      }
      if (champ || ligne.length) { ligne.push(champ); lignes.push(ligne); }
      return lignes;
    }

    function depuisCsv(txt) {
      var l = parseCsv(txt);
      if (l.length < 2) return [];
      var ent = l[0].map(function (h) { return h.toLowerCase(); });
      function col(re) { for (var i = 0; i < ent.length; i++) if (re.test(ent[i])) return i; return -1; }
      var cDate = col(/horodat|timestamp|date/), cDe = col(/pr[ée]nom|qui|nom|de la part/), cTxt = col(/message|texte/), cPhoto = col(/photo|image/);
      return l.slice(1).map(function (r) {
        return { date: cDate >= 0 ? r[cDate] : "", de: cDe >= 0 ? r[cDe].trim() : "", texte: cTxt >= 0 ? r[cTxt].trim() : "", photo: cPhoto >= 0 ? r[cPhoto].trim() : "" };
      }).filter(function (m) { return m.texte; }).reverse().slice(0, 15); // les plus récents d'abord
    }

    function cleMessage(m) { return (m.date || "") + "|" + m.de + "|" + m.texte.slice(0, 40); }
    function nonLus() { var lus = lire("messagesLus", []); return messages.filter(function (m) { return lus.indexOf(cleMessage(m)) < 0; }).length; }

    function chargerMessages() {
      if (!C.messagesCsvUrl) { messages = C.messagesExemple || []; majAccueil(); return; }
      fetch(C.messagesCsvUrl + (C.messagesCsvUrl.indexOf("?") >= 0 ? "&" : "?") + "t=" + Date.now())
        .then(function (r) { return r.text(); })
        .then(function (t) { messages = depuisCsv(t); ecrire("cacheMessages", messages); majAccueil(); })
        .catch(function () { messages = lire("cacheMessages", C.messagesExemple || []); majAccueil(); });
    }

    function photoDe(m) {
      if (m.photo && /^https?:/.test(m.photo)) return m.photo;
      var f = C.famille || {};
      for (var nom in f) if (nom.toLowerCase() === (m.de || "").toLowerCase()) return f[nom];
      return "";
    }

    function afficherMessage() {
      if (!messages.length) {
        $("msg-qui").textContent = "Pas encore de message aujourd'hui.";
        $("msg-corps").textContent = "Ta famille pense à toi.";
        $("msg-date").textContent = "";
        $("msg-suivant").style.display = "none";
        return;
      }
      var m = messages[indexMessage % messages.length];
      var p = $("msg-portrait");
      p.style.backgroundImage = ""; p.textContent = (m.de || "?").charAt(0).toUpperCase();
      p.style.backgroundColor = "var(--bleu)";
      fond(p, photoDe(m));
      $("msg-qui").textContent = m.de ? m.de + " t'écrit :" : "";
      $("msg-corps").textContent = m.texte;
      $("msg-date").textContent = dateLisible(m.date);
      $("msg-suivant").style.display = messages.length > 1 ? "" : "none";
      var lus = lire("messagesLus", []);
      if (lus.indexOf(cleMessage(m)) < 0) { lus.push(cleMessage(m)); ecrire("messagesLus", lus.slice(-200)); }
      direAuto((m.de ? "Message de " + m.de + ". " : "") + m.texte);
    }

    function dateLisible(s) {
      // Google Sheets donne « 26/09/2026 14:03:00 »
      var r = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s || "");
      if (!r) return "";
      var d = new Date(+r[3], +r[2] - 1, +r[1]);
      var diff = jourNumero() - Math.floor(d.getTime() / 86400000);
      if (diff === 0) return "Écrit aujourd'hui";
      if (diff === 1) return "Écrit hier";
      return "Écrit le " + d.toLocaleDateString("fr-BE", { weekday: "long", day: "numeric", month: "long" });
    }

    function ouvrirMessages() { indexMessage = 0; afficherMessage(); }
    $("msg-suivant").addEventListener("click", function () { indexMessage++; afficherMessage(); });
    $("msg-ecouter").addEventListener("click", function () {
      var m = messages[indexMessage % messages.length];
      if (m) dire((m.de ? "Message de " + m.de + ". " : "") + m.texte);
    });

    // ---------- Savant du jour ----------
    var savants = C.savants || [];
    var savant = savants.length ? savants[jourNumero() % savants.length] : null;
    var savantTexte = savant ? savant.resume : "";
    var savantImage = "";

    function troisPhrases(t) {
      var p = t.replace(/\s*\([^)]*\)/g, "").match(/[^.!?]+[.!?]+/g) || [t];
      return p.slice(0, 3).join(" ").trim();
    }

    function chargerSavant() {
      if (!savant) return;
      var cache = lire("savant", null);
      if (cache && cache.page === savant.page) { savantTexte = cache.texte; savantImage = cache.image; majAccueil(); return; }
      fetch("https://fr.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(savant.page.replace(/ /g, "_")))
        .then(function (r) { if (!r.ok) throw 0; return r.json(); })
        .then(function (j) {
          if (j.extract) savantTexte = troisPhrases(j.extract);
          savantImage = (j.originalimage && j.originalimage.source) || (j.thumbnail && j.thumbnail.source) || "";
          ecrire("savant", { page: savant.page, texte: savantTexte, image: savantImage });
          majAccueil();
        })
        .catch(function () {});
    }

    function ouvrirSavant() {
      if (!savant) return;
      var p = $("sav-portrait");
      p.textContent = "🔬"; p.style.backgroundImage = "";
      fond(p, savantImage);
      $("sav-nom").textContent = savant.nom;
      $("sav-texte").textContent = savantTexte;
      direAuto(savant.nom + ". " + savantTexte);
    }
    $("sav-ecouter").addEventListener("click", function () { if (savant) dire(savant.nom + ". " + savantTexte); });

    // ---------- Vidéos ----------
    // Ordre mélangé différemment chaque jour ; 3 choix à la fois.
    function melange(liste, graine) {
      var r = liste.slice(), x = graine || 1;
      for (var i = r.length - 1; i > 0; i--) {
        x = (x * 9301 + 49297) % 233280;
        var j = Math.floor(x / 233280 * (i + 1));
        var t = r[i]; r[i] = r[j]; r[j] = t;
      }
      return r;
    }
    var mauvaises = lire("videosMauvaises", []);
    function videosValides() {
      return (C[rubrique] || []).filter(function (v) { return mauvaises.indexOf(v.id || v.playlist) < 0; });
    }
    var rubrique = "videos";
    var toutesVideos = melange(videosValides(), jourNumero());
    var pageVideos = 0;
    function choisirRubrique(r) {
      rubrique = r;
      toutesVideos = melange(videosValides(), jourNumero());
      pageVideos = 0;
      $("titre-videos").textContent = r === "films" ? "Quel film veux-tu voir ?" : "Que veux-tu regarder ?";
      $("choix-videos").classList.toggle("films", r === "films");
      construireVideos();
    }
    function vignette(v) { return "https://i.ytimg.com/vi/" + encodeURIComponent(v.vignette || v.id) + "/hqdefault.jpg"; }
    function videosAffichees() {
      if (!toutesVideos.length) return [];
      var r = [];
      for (var i = 0; i < Math.min(3, toutesVideos.length); i++) r.push(toutesVideos[(pageVideos * 3 + i) % toutesVideos.length]);
      return r;
    }

    function construireVideos() {
      var zone = $("choix-videos");
      zone.innerHTML = "";
      videosAffichees().forEach(function (v) {
        var b = document.createElement("button");
        b.className = "tuile";
        var img = document.createElement("div");
        img.className = "image";
        fond(img, vignette(v));
        var lib = document.createElement("div");
        lib.className = "libelle";
        lib.textContent = v.titre;
        var s = document.createElement("span");
        s.className = "sous"; s.textContent = v.source || "";
        lib.appendChild(s);
        b.appendChild(img); b.appendChild(lib);
        b.addEventListener("click", function () { lancer(v); });
        zone.appendChild(b);
      });
    }
    $("retour-lecture").addEventListener("click", function () { aller("videos"); });
    $("autres-videos").addEventListener("click", function () { pageVideos++; construireVideos(); });

    // Lecteur YouTube (API officielle) : saute les vidéos indisponibles,
    // revient aux choix quand la vidéo est finie.
    var lecteur = null, videoEnCours = null, apiPrete = null, erreursDeSuite = 0;
    function chargerApi() {
      if (apiPrete) return apiPrete;
      apiPrete = new Promise(function (ok) {
        window.onYouTubeIframeAPIReady = ok;
        var sc = document.createElement("script");
        sc.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(sc);
      });
      return apiPrete;
    }
    // Reprise là où on s'était arrêté + pause toutes les 30 minutes
    var PAUSE_MS = (C.pauseMinutes || 30) * 60 * 1000;
    var suivi = null, tempsVu = 0;
    function positions() { return lire("positions", {}); }
    function memoriserPosition() {
      if (!lecteur || !videoEnCours || videoEnCours.playlist || !lecteur.getCurrentTime) return;
      var t = lecteur.getCurrentTime(), d = lecteur.getDuration ? lecteur.getDuration() : 0;
      var p = positions();
      if (t > 60 && (!d || t < d - 120)) p[videoEnCours.id] = Math.floor(t); else delete p[videoEnCours.id];
      ecrire("positions", p);
    }
    function suivreLecture() {
      clearInterval(suivi); tempsVu = 0;
      suivi = setInterval(function () {
        if (!lecteur || !lecteur.getPlayerState || lecteur.getPlayerState() !== YT.PlayerState.PLAYING) return;
        memoriserPosition();
        tempsVu += 10000;
        if (tempsVu >= PAUSE_MS) { tempsVu = 0; lecteur.pauseVideo(); taire(); $("pause").classList.add("visible"); $("pause-continuer").focus(); dire("On fait une petite pause ?"); }
      }, 10000);
    }
    $("pause-continuer").addEventListener("click", function () { $("pause").classList.remove("visible"); if (lecteur) lecteur.playVideo(); });
    $("pause-arreter").addEventListener("click", function () { $("pause").classList.remove("visible"); aller("videos"); });

    function arreterLecteur() {
      memoriserPosition();
      clearInterval(suivi);
      $("pause").classList.remove("visible");
      if (lecteur && lecteur.destroy) { try { lecteur.destroy(); } catch (e) {} }
      lecteur = null; videoEnCours = null;
      $("lecteur").innerHTML = "";
    }
    function lancer(v) {
      arreterLecteur();
      videoEnCours = v;
      $("lecture-titre").textContent = v.titre;
      var div = document.createElement("div");
      $("lecteur").appendChild(div);
      aller("lecture");
      var vars = { autoplay: 1, rel: 0, modestbranding: 1, playsinline: 1, hl: "fr", cc_lang_pref: "fr", iv_load_policy: 3 };
      if (v.playlist) { vars.listType = "playlist"; vars.list = v.playlist; }
      chargerApi().then(function () {
        if (videoEnCours !== v) return;
        lecteur = new YT.Player(div, {
          host: "https://www.youtube-nocookie.com",
          width: "100%", height: "100%",
          videoId: v.playlist ? undefined : v.id,
          playerVars: vars,
          events: {
            onReady: function (e) {
              if (v.playlist) {
                e.target.setShuffle(true);
                var n = (e.target.getPlaylist() || []).length;
                e.target.playVideoAt(n ? Math.floor(Math.random() * n) : 0);
              } else {
                var dejaVu = positions()[v.id];
                if (dejaVu) e.target.seekTo(dejaVu, true);
                e.target.playVideo();
              }
              suivreLecture();
            },
            onStateChange: function (e) {
              if (e.data === YT.PlayerState.PLAYING) erreursDeSuite = 0;
              if (e.data === YT.PlayerState.ENDED && !v.playlist) {
                var p = positions(); delete p[v.id]; ecrire("positions", p);
                videoEnCours = null; aller("videos");
              }
            },
            onError: function (e) {
              // 100 = supprimée, 101/150 = intégration interdite : on n'y revient plus
              if (!v.playlist && [100, 101, 150].indexOf(e.data) >= 0) {
                mauvaises.push(v.id); ecrire("videosMauvaises", mauvaises.slice(-100));
                toutesVideos = toutesVideos.filter(function (x) { return x !== v; });
                construireVideos();
              }
              if (++erreursDeSuite > 5) { erreursDeSuite = 0; aller("videos"); return; }
              var autres = toutesVideos.filter(function (x) { return x !== v; });
              if (autres.length) lancer(autres[Math.floor(Math.random() * autres.length)]);
              else aller("videos");
            }
          }
        });
      });
    }

    // ---------- Nouvelles du jour ----------
    var nouvelles = [], indexNouvelle = 0;
    function chargerNouvelles() {
      var cache = lire("nouvelles", null);
      if (cache && cache.jour === jourNumero() && cache.liste.length) { nouvelles = cache.liste; majAccueil(); return; }
      fetch("api/nouvelles")
        .then(function (r) { if (!r.ok) throw 0; return r.json(); })
        .then(function (j) {
          nouvelles = j.nouvelles || [];
          if (nouvelles.length) ecrire("nouvelles", { jour: jourNumero(), liste: nouvelles });
          majAccueil();
        })
        .catch(function () { if (cache) nouvelles = cache.liste; });
    }
    function afficherNouvelle() {
      var p = $("nv-image");
      p.style.backgroundImage = ""; p.textContent = "📰";
      if (!nouvelles.length) {
        $("nv-titre").textContent = "Les nouvelles arrivent bientôt.";
        $("nv-texte").textContent = "Reviens un peu plus tard.";
        $("nv-source").textContent = "";
        $("nv-suivant").style.display = "none";
        return;
      }
      var n = nouvelles[indexNouvelle % nouvelles.length];
      fond(p, n.image);
      p.style.backgroundSize = n.image ? "cover" : "";
      $("nv-titre").textContent = n.titre;
      $("nv-texte").textContent = n.texte;
      $("nv-source").textContent = n.source ? "Source : " + n.source : "";
      $("nv-suivant").style.display = nouvelles.length > 1 ? "" : "none";
      direAuto(n.titre + ". " + n.texte);
    }
    function ouvrirNouvelles() { indexNouvelle = 0; afficherNouvelle(); }
    $("nv-suivant").addEventListener("click", function () { indexNouvelle++; afficherNouvelle(); });
    $("nv-ecouter").addEventListener("click", function () {
      var n = nouvelles[indexNouvelle % nouvelles.length];
      if (n) dire(n.titre + ". " + n.texte);
    });

    // ---------- Discuter (reconnaissance vocale de Chrome + Gemini) ----------
    var Reco = window.SpeechRecognition || window.webkitSpeechRecognition;
    var reco = null, historique = [], ecoute = false, relances = 0;
    function etat(t) { $("disc-etat").textContent = t; }
    function montrerErreurVoix(erreur) {
      var voix = voixFr ? voixFr.name : "aucune voix française";
      $("disc-etat").innerHTML = "Appuie sur le micro, puis parle.<br><small style=\"font-size:.45em;font-weight:400;color:#8a7a60\">Son : " +
        String(erreur).replace(/[<>&]/g, "") + " (" + voix.replace(/[<>&]/g, "") + ")</small>";
    }
    function ouvrirDiscussion() {
      historique = []; relances = 0;
      $("disc-reecouter").style.display = "none";
      $("disc-lui").textContent = "";
      $("disc-ordi").textContent = "Bonjour ! De quoi as-tu envie de parler ?";
      if (!Reco) { etat("Le micro ne fonctionne pas sur cet ordinateur."); return; }
      etat("Appuie sur le micro, puis parle.");
    }
    function fermerDiscussion() {
      ecoute = false;
      if (reco) { try { reco.abort(); } catch (e) {} reco = null; }
      $("disc-micro").classList.remove("ecoute");
    }
    function ecouter() {
      if (!Reco || ecoute) return;
      taire();
      reco = new Reco();
      reco.lang = "fr-FR"; reco.interimResults = true; reco.continuous = false; reco.maxAlternatives = 1;
      var texte = "";
      reco.onresult = function (e) {
        texte = Array.prototype.map.call(e.results, function (r) { return r[0].transcript; }).join(" ");
        $("disc-lui").textContent = texte;
      };
      reco.onerror = function (e) {
        if (e.error === "not-allowed" || e.error === "service-not-allowed") etat("Il faut autoriser le micro.");
      };
      reco.onend = function () {
        ecoute = false; reco = null;
        $("disc-micro").classList.remove("ecoute");
        if (ecranActuel !== "discuter") return;
        if (texte.trim()) { relances = 0; repondre(texte.trim()); }
        else etat("Appuie sur le micro, puis parle.");
      };
      ecoute = true;
      $("disc-micro").classList.add("ecoute");
      $("disc-lui").textContent = "";
      etat("Je t'écoute…");
      try { reco.start(); } catch (e) { ecoute = false; $("disc-micro").classList.remove("ecoute"); }
    }
    function repondre(texte) {
      historique.push({ qui: "lui", texte: texte });
      etat("Je réfléchis…");
      $("disc-ordi").textContent = "…";
      fetch("api/discuter", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ historique: historique.slice(-12), profil: C.profil || "" })
      })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw j; return j; }); })
        .then(function (j) {
          if (ecranActuel !== "discuter") return;
          historique.push({ qui: "ordi", texte: j.reponse });
          // Le texte apparaît au moment où la voix commence (au plus tard après 4 s).
          var affiche = false;
          function afficher() {
            if (affiche || ecranActuel !== "discuter") return;
            affiche = true;
            $("disc-ordi").textContent = j.reponse;
            $("disc-reecouter").style.display = "";
            etat("");
          }
          setTimeout(afficher, 4000);
          // Petit délai : juste après le micro, Chrome refuse parfois de parler.
          setTimeout(function () {
            if (ecranActuel !== "discuter") return;
            dire(j.reponse, function (erreur) {
              afficher();
              if (ecranActuel !== "discuter") return;
              if (erreur) { etat("Appuie sur le micro, puis parle."); montrerErreurVoix(erreur); return; }
              if (relances < 1 && C.ecouteAutomatique === true) { relances++; ecouter(); }
              else etat("Appuie sur le micro, puis parle.");
            }, false, afficher);
          }, 250);
        })
        .catch(function (j) {
          if (ecranActuel !== "discuter") return;
          var msg = j && j.erreur === "non configuré"
            ? "La discussion n'est pas encore activée."
            : "Je n'arrive pas à répondre pour le moment. Réessaie un peu plus tard.";
          $("disc-ordi").textContent = msg; dire(msg);
          etat("Appuie sur le micro, puis parle.");
        });
    }
    $("disc-reecouter").addEventListener("click", function () {
      if (ecoute && reco) { try { reco.abort(); } catch (e) {} }
      dire($("disc-ordi").textContent);
    });
    $("disc-micro").addEventListener("click", function () {
      relances = 0;
      if (ecoute && reco) reco.stop(); else ecouter();
    });

    // ---------- Images des tuiles d'accueil ----------
    // Illustrations fixes des tuiles (dossier illustrations/) : la même image
    // chaque jour aide à se repérer. Sans illustration, image du jour ou pictogramme.
    var illustrations = {};
    [["messages", "img-messages"], ["nouvelles", "img-nouvelles"], ["savant", "img-savant"],
     ["discuter", "img-discuter"], ["documentaires", "img-videos"], ["films", "img-films"]].forEach(function (t) {
      var ext = ["jpg", "png", "webp", "jpeg"], i = 0;
      (function essayer() {
        if (i >= ext.length) return;
        var url = "illustrations/" + t[0] + "." + ext[i++], img = new Image();
        img.onload = function () { illustrations[t[1]] = url; majAccueil(); };
        img.onerror = essayer;
        img.src = url;
      })();
    });
    function image(id, url) {
      if (illustrations[id]) url = illustrations[id];
      if (url) fond($(id), url);
    }

    function majAccueil() {
      var n = nonLus();
      var im = $("img-messages");
      im.innerHTML = "";
      im.style.backgroundImage = "";
      var dernier = messages[0];
      if (!illustrations["img-messages"] && !(dernier && photoDe(dernier))) im.textContent = "✉️";
      image("img-messages", dernier && photoDe(dernier));
      if (n > 0) { var p = document.createElement("span"); p.className = "pastille"; p.textContent = n; im.appendChild(p); }
      image("img-savant", savantImage);
      image("img-nouvelles", nouvelles[0] && nouvelles[0].image);
      image("img-discuter", "");
      var d = melange(C.videos || [], jourNumero())[0], f = melange(C.films || [], jourNumero())[0];
      image("img-videos", d && vignette(d));
      image("img-films", f && vignette(f));
    }

    construireVideos();
    chargerMessages();
    chargerSavant();
    chargerNouvelles();
    majAccueil();
    setInterval(chargerMessages, 10 * 60 * 1000); // nouveaux messages toutes les 10 minutes
    // Frein à la fermeture : Chrome demande « Quitter le site ? » avant de fermer.
    var rechargementVoulu = false;
    function recharger() { rechargementVoulu = true; location.reload(); }
    if (C.bloquerFermeture !== false) {
      window.addEventListener("beforeunload", function (e) {
        if (rechargementVoulu) return;
        e.preventDefault();
        e.returnValue = "";
      });
    }

    // Mise à jour : bouton discret, et rechargement automatique quand une
    // nouvelle version est publiée (vérifiée toutes les 15 minutes, uniquement
    // quand l'accueil est affiché et que personne n'utilise l'ordinateur).
    $("maj").addEventListener("click", function () { recharger(); });
    var versionChargee = null, derniereActivite = Date.now();
    ["mousemove", "mousedown", "keydown"].forEach(function (t) { document.addEventListener(t, function () { derniereActivite = Date.now(); }); });
    function verifierVersion() {
      fetch("api/version", { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) {
          if (!j || !j.version) return;
          if (!versionChargee) { versionChargee = j.version; return; }
          if (j.version !== versionChargee && ecranActuel === "accueil" && Date.now() - derniereActivite > 60 * 1000) recharger();
        })
        .catch(function () {});
    }
    verifierVersion();
    setInterval(verifierVersion, 15 * 60 * 1000);

    // Au changement de jour, on recharge tout (nouveau savant, nouvelles vidéos)
    var jour = jourNumero();
    setInterval(function () { if (jourNumero() !== jour && ecranActuel === "accueil") recharger(); }, 60 * 1000);

    // Réveil : quand on rouvre le capot, on repart toujours de l'accueil
    var dernierTic = Date.now();
    function auReveil() {
      calme();
      if (jourNumero() !== jour) { recharger(); return; }
      aller("accueil");
      chargerMessages();
      majHorloge();
      if (C.direBonjourAuReveil !== false) {
        setTimeout(function () { dire(phraseDuMoment()); }, 1500);
      }
    }
    setInterval(function () {
      var maintenant = Date.now();
      if (maintenant - dernierTic > 2 * 60 * 1000) auReveil(); // l'ordinateur dormait
      dernierTic = maintenant;
    }, 10 * 1000);
  })();
